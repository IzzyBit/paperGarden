<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#faf8ff" />
    <script>
      (() => {
        try {
          const saved = localStorage.getItem('paper-garden-theme');
          document.documentElement.dataset.theme = saved === 'dark' || saved === 'light'
            ? saved : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          if (document.documentElement.dataset.theme === 'dark')
            document.querySelector('meta[name="theme-color"]').content = '#191a2e';
        } catch {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="description" content="A quiet place to grow your research ideas." />
    <title>Paper Garden · a quiet space for ideas</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
